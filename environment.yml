name: vandal
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.2.0
  - torchvision=0.17.0
  - torchaudio=2.2.0
  - pytorch-cuda=11.8          # change to 12.1 if on newer drivers
  - cudatoolkit=11.8
  - numpy=1.26.*
  - pillow
  - pyyaml
  - tqdm
  - scikit-learn
  - matplotlib
  - pip

  - pip:
    - transformers>=4.40.0
    - timm>=0.9.16
    - einops
    - wandb
    - opencv-python-headless
    - scipy
